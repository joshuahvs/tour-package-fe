stages:
  - build
  - docker-push
  - deploy

variables:
  DOCKER_IMAGE_NAME: joshuahansvito/tour-package-fe
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# Stage 1: Build Vue App (Menghasilkan folder dist/)
build:
  stage: build
  image: node:20
  script:
    - npm ci
    # Membuat file .env untuk production build
    - |
      cat <<EOF > .env.production
      VITE_API_BASE_URL=${VITE_API_BASE_URL}
      VITE_TOPUP_SERVICE_URL=${VITE_TOPUP_SERVICE_URL}
      EOF
    - npm run build
  artifacts:
    paths:
      - dist/
      - .env.production
    expire_in: 1 hour

# Stage 2: Build & Push Docker Image
docker-push:
  stage: docker-push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    # Menggunakan Dockerfile (Pastikan namanya Dockerfile huruf besar D)
    - docker build -t $DOCKER_IMAGE_NAME:$IMAGE_TAG .
    - docker push $DOCKER_IMAGE_NAME:$IMAGE_TAG
  dependencies:
    - build
  only:
    - main

# Stage 3: Deploy ke AWS EC2 (K3s)
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    # Trik ampuh fix format SSH Key dari GitLab variable:
    - echo "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    # Mengganti tag image di deployment.yaml
    - sed "s|REPLACE_ME_TAG|$IMAGE_TAG|g" k8s/deployment.yaml > deployment.yaml
    
    # Membuat folder tujuan di server
    - ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "mkdir -p ~/app/k8s"
    
    # Upload file YAML
    - scp -o StrictHostKeyChecking=no deployment.yaml $EC2_USER@$EC2_HOST:~/app/k8s/deployment.yaml
    - scp -o StrictHostKeyChecking=no k8s/service.yaml $EC2_USER@$EC2_HOST:~/app/k8s/service.yaml
    - scp -o StrictHostKeyChecking=no k8s/ingress.yaml $EC2_USER@$EC2_HOST:~/app/k8s/ingress.yaml

    # Apply ke Kubernetes (K3s)
    - ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/deployment.yaml"
    - ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/service.yaml"
    - ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/ingress.yaml"
  only:
    - main