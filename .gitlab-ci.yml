stages:
  - build
  - docker-push
  - deploy

variables:
  DOCKER_IMAGE_NAME: joshuahansvito/tour-package-fe
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: node:20
  script:
    - npm ci
    # --- Penambahan Variabel Environment (Sesuai Screenshot) ---
    - |
      cat <<EOF > .env
      VITE_API_BASE_URL=$VITE_API_BASE_URL
      VITE_API_URL=$VITE_API_URL
      VITE_TOPUP_SERVICE_URL=$VITE_TOPUP_SERVICE_URL
      EOF
    # -----------------------------------------------------------
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

Berdasarkan log error: ERROR: docker: 'docker buildx build' requires 1 argument

Ini artinya perintah docker build kamu menjadi kacau ("bingung") saat dijalankan. Dia menganggap kamu memasukkan lebih dari satu folder tujuan (padahal seharusnya cuma satu, yaitu tanda titik . di akhir).

Penyebab paling umum adalah:

Masalah Backslash (\): Penggunaan backslash untuk multiline di dalam script YAML GitLab kadang tidak terbaca dengan baik oleh shell (tergantung runner-nya), sehingga spasi atau baris barunya hilang/salah baca.

Spasi di Variabel: Jika salah satu variabel ($VITE_...) ternyata kosong atau mengandung spasi dan tidak diberi tanda kutip, perintahnya akan terpotong dan dianggap sebagai argumen baru.

Solusi: Jadikan Satu Baris & Pakai Tanda Kutip
Ubah bagian script di stage docker-push kamu menjadi satu baris panjang dan tambahkan tanda kutip pada setiap variabel untuk keamanan.

Ganti bagian docker-push di .gitlab-ci.yml kamu dengan ini:

YAML

docker-push:
  stage: docker-push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build --build-arg "VITE_API_BASE_URL=$VITE_API_BASE_URL" --build-arg "VITE_API_URL=$VITE_API_URL" --build-arg "VITE_TOPUP_SERVICE_URL=$VITE_TOPUP_SERVICE_URL" -t "$DOCKER_IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$DOCKER_IMAGE_NAME:$IMAGE_TAG"
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh bash
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - sed "s|REPLACE_ME_TAG|$IMAGE_TAG|g" k8s/deployment.yaml > deployment.yaml

    - ssh $EC2_USER@$EC2_HOST "mkdir -p ~/app/k8s"
    - scp deployment.yaml $EC2_USER@$EC2_HOST:~/app/k8s/deployment.yaml
    - scp k8s/service.yaml $EC2_USER@$EC2_HOST:~/app/k8s/service.yaml
    - scp k8s/ingress.yaml $EC2_USER@$EC2_HOST:~/app/k8s/ingress.yaml

    - ssh $EC2_USER@$EC2_HOST "sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/deployment.yaml"
    - ssh $EC2_USER@$EC2_HOST "sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/service.yaml"
    - ssh $EC2_USER@$EC2_HOST "sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/ingress.yaml"
  only:
    - main